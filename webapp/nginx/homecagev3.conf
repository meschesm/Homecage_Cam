server {
    # Bind exclusively to the Tailscale interface — not reachable from LAN or internet
    listen 100.70.127.43:80;
    server_name _;

    # Proxy to uvicorn on loopback
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connections alive for SSE / long polls
        proxy_set_header Connection        "";
        proxy_buffering                    off;
        proxy_read_timeout                 3600s;
    }

    # Increase for future file uploads
    client_max_body_size 64M;

    access_log /var/log/nginx/homecagev3_access.log;
    error_log  /var/log/nginx/homecagev3_error.log;
}
